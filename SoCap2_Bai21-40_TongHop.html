<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập & Kiểm tra tổng hợp · Sơ cấp 2 · Hoa Ngữ Nhất Tâm</title>
<style>
  :root{
    --green:#1f7f3e; --green-dark:#155c2c; --green-light:#E8F7EF;
    --bg:#F7FFF9; --white:#FFFFFF; --ink:#333333;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Be Vietnam Pro','Inter',-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); height:100vh; overflow:hidden;
  }
  .app{display:flex; flex-direction:column; height:100vh;}

  /* Header — 1 màu xanh Grab đậm, đồng nhất, không dùng gradient để tránh lệch màu */
  header{
    background:var(--green-dark);
    color:#fff; padding:10px 20px; display:flex; align-items:center; gap:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.12); flex-shrink:0; z-index:10;
  }
  .logo-circle{
    width:44px; height:44px; border-radius:50%; background:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 1px 5px rgba(0,0,0,.2);
  }
  .logo-circle img{width:120%; height:120%; object-fit:cover;}
  header h1{font-size:16px; margin:0; font-weight:700; line-height:1.3;}
  header p{margin:2px 0 0; font-size:12px; opacity:.9;}
  .menu-toggle{
    display:none; margin-left:auto; background:rgba(255,255,255,.18); border:none;
    color:#fff; font-size:20px; width:38px; height:38px; border-radius:8px; cursor:pointer;
  }

  /* Body layout */
  .body-wrap{display:flex; flex:1; min-height:0;}

  /* Sidebar */
  nav.sidebar{
    width:250px; background:var(--white); border-right:1px solid #d9ede1;
    overflow-y:auto; flex-shrink:0; padding:10px 0;
  }
  .sidebar-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#5f8f70;
    padding:6px 18px 8px; font-weight:700;
  }
  .lesson-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; padding:11px 18px; cursor:pointer;
    font-family:inherit; font-size:13.5px; color:var(--ink); border-left:3px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .lesson-btn:hover{background:var(--green-light);}
  .lesson-btn.active{
    background:var(--green-light); border-left:3px solid var(--green); color:var(--green-dark); font-weight:700;
  }
  .lesson-num{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--green-light);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    color:var(--green-dark);
  }
  .lesson-btn.active .lesson-num{background:var(--green); color:#fff;}
  .lesson-text{overflow:hidden;}
  .lesson-zh{display:block; font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lesson-sub{display:block; font-size:11px; color:#7a8b80;}

  /* Main content */
  main{flex:1; min-width:0; position:relative; background:var(--white);}
  iframe{width:100%; height:100%; border:none; display:block;}
  .loading-hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#8fa89a; font-size:13px; pointer-events:none;
  }

  /* Mobile */
  @media (max-width:760px){
    .menu-toggle{display:block;}
    nav.sidebar{
      position:fixed; top:60px; left:0; bottom:0; z-index:20; width:78vw; max-width:300px;
      transform:translateX(-100%); transition:transform .2s ease; box-shadow:2px 0 14px rgba(0,0,0,.15);
    }
    nav.sidebar.open{transform:translateX(0);}
    .overlay{
      display:none; position:fixed; inset:60px 0 0 0; background:rgba(0,0,0,.35); z-index:15;
    }
    .overlay.show{display:block;}
    header h1{font-size:14px;}
    header p{font-size:10.5px;}
  }
</style>
</head>

}

function selectLesson(file){
  frameEl.setAttribute('data-current', file);
  frameEl.src = file;
  document.querySelectorAll('.lesson-btn').forEach(function(b){

  window.scrollTo(0,0);
